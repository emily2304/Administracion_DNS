apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-api
  labels:
    app.kubernetes.io/name: dns-api
    app.kubernetes.io/part-of: ic7602-p1
spec:
  replicas: {{ .Values.replicaCount.dnsApi }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-api
        app.kubernetes.io/part-of: ic7602-p1
    spec:
      containers:
        - name: dns-api
          image: "{{ .Values.images.dnsApi.repository }}:{{ .Values.images.dnsApi.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.dnsApi.port }}
              protocol: TCP
          env:
            - name: EXTERNAL_DNS_SERVER
              valueFrom:
                configMapKeyRef:
                  name: ic7602-p1-config
                  key: EXTERNAL_DNS_SERVER

            - name: EXTERNAL_DNS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ic7602-p1-config
                  key: EXTERNAL_DNS_PORT

            - name: SUPABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ic7602-p1-config
                  key: SUPABASE_URL

            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: ic7602-p1-secret
                  key: VITE_SUPABASE_ANON_KEY