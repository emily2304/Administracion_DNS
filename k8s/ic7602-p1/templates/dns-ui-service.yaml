apiVersion: v1
kind: Service
metadata:
  name: dns-ui
  labels:
    app.kubernetes.io/name: dns-ui
    app.kubernetes.io/part-of: ic7602-p1
spec:
  type: {{ .Values.service.dnsUi.type }}
  selector:
    app.kubernetes.io/name: dns-ui
  ports:
